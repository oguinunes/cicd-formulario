<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro — CI/CD Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Criar conta</h1>
    <p class="subtitulo">Publicado automaticamente via GitHub Actions</p>

    <form id="form-cadastro">
      <div class="campo">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" placeholder="João Silva">
      </div>

      <div class="campo">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="joao@email.com">
      </div>

      <div class="campo">
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="Mínimo 8 caracteres">
        <small>Deve conter maiúscula e número</small>
      </div>

      <button type="submit">Cadastrar</button>
    </form>

    <div id="feedback"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
